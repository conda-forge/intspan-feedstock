{% set name = "intspan" %}
{% set version = "1.6.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/intspan-{{ version }}.tar.gz
  sha256: 2ebefbfeeea9fd07e50e3969671712ed3ade730355d3224a41829fc31f7fc0b2

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - intspan
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jonathaneunice/intspan
  summary: Sets of integers like 1,3-7,33
  dev_url: https://github.com/jonathaneunice/intspan
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - synapticarbors
